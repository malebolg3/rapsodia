name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Definir Variáveis de Ambiente
        id: set-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_path=~/th1er/abitat/Rapsodia" >> $GITHUB_OUTPUT
            echo "healthcheck_port=10003" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=~/th1er/malebolge/Rapsodia" >> $GITHUB_OUTPUT
            echo "healthcheck_port=10001" >> $GITHUB_OUTPUT
          fi

      - name: Implantar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ steps.set-env.outputs.deploy_path }}
            git pull
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              cp Dockerfile.prod Dockerfile
            fi
            docker compose build --no-cache
            docker compose down
            docker compose up -d
            sleep 5
            docker compose ps

      - name: Validação de healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in {1..30}; do
              if curl -sf http://localhost:${{ steps.set-env.outputs.healthcheck_port }}/api/health > /dev/null 2>&1; then
                echo "✅ Healthcheck passou!"
                exit 0
              fi
              echo "Aguardando o container ficar saudável... ($i/30)"
              sleep 2
            done
            echo "❌ Healthcheck falhou!"
            exit 1

      - name: Notificar em caso de falha
        if: failure()
        run: |
          echo "❌ Implantação falhou!"
          exit 1

      - name: Notificar em caso de sucesso
        if: success()
        run: |
          echo "✅ Implantação bem-sucedida!"